[build]
  publish = "dist"
  command = "npm run build"
  environment = { NODE_VERSION = "22" }

# Purge Cloudflare CDN cache after successful deploy.
[[plugins]]
  package = "@esphome/netlify-plugin-cloudflare-cache-purge"

# Cloudflare caches pages for a week; changed URLs are purged after each deploy
# by the plugin above. Browsers revalidate hourly.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
    Cloudflare-CDN-Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Fingerprinted assets (Astro build output in /_astro/) - 1 year, immutable
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Cloudflare-CDN-Cache-Control = "public, max-age=31536000, immutable"

# Static images and favicon (public/images/) - browser: 1 week, CDN: 1 month
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
    Cloudflare-CDN-Cache-Control = "public, max-age=2592000, stale-while-revalidate=604800"

# Sitemap - browser: 1 hour, CDN: 1 day
[[headers]]
  for = "/sitemap*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Cloudflare-CDN-Cache-Control = "public, max-age=86400"

# Blog RSS feed is consumed by subscribers, keep it fresher - CDN: 1 day
[[headers]]
  for = "/blog/rss.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Cloudflare-CDN-Cache-Control = "public, max-age=86400"

# Astro forbids leading underscores in content filenames, so this post's slug
# dropped the `_` that the old Material URL had. Redirect the legacy URL.
[[redirects]]
  from = "/blog/2025/05/14/_schema-deprecations/"
  to = "/blog/2025/05/14/schema-deprecations/"
  status = 301
  force = true

# The MkDocs Material site published two RSS feeds; starlight-blog publishes
# one. Point existing feed subscriptions at the new feed.
[[redirects]]
  from = "/feed_rss_created.xml"
  to = "/blog/rss.xml"
  status = 301
  force = true

[[redirects]]
  from = "/feed_rss_updated.xml"
  to = "/blog/rss.xml"
  status = 301
  force = true

# The logging page moved to /architecture/logging/best_practices/ when the logging
# overview was added. Browsers keep the #fragment, so old anchor links still land.
[[redirects]]
  from = "/architecture/logging/"
  to = "/architecture/logging/best_practices/"
  status = 301
  force = true
